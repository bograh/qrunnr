# Disposable dependencies for `make test-integration`. Uses non-default
# ports and no volumes so it never touches a development database.
name: qrunnr-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrunnr
      POSTGRES_PASSWORD: qrunnr
      POSTGRES_DB: qrunnr_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrunnr -d qrunnr_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
